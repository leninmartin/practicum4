<!DOCTYPE html>
<html>
<head>
  <style>
    /* Basic Page Setup */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
    }

    /* Heading Styles */
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    hr {
      margin-bottom: 20px;
    }

    /* Two Box Layout */
    .container {
      display: flex;
      gap: 15px;
    }

    .box {
      flex: 1;
      border: 1px solid #ccc;
      padding: 15px;
      border-radius: 5px;
    }

    /* Text Formatting */
    .italic-text {
      font-style: italic;
    }

    .uppercase-text {
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>CSS Text Styles and<br>Layouts</h1>
  <hr>

  <h2>Simple Web Layout Using CSS</h2>
  <p>This is a simple example of a web layout using various CSS text styles.</p>
  <br>

  <!-- Side-by-Side Boxes -->
  <div class="container">
    <div class="box">
      <h3>Sidebar</h3>
      <p class="italic-text">Italic Text.</p>
    </div>

    <div class="box">
      <h3>Main Content</h3>
      <p class="uppercase-text">Uppercase Text.
        
      </p>
    </div>
  </div>

</body>
</html>
